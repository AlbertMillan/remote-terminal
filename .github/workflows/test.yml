name: Tests (Windows)

# The fast set only: `npm test`, the same typecheck + vitest run sessions and the
# factory's verify step use. The slow suites (vitest.shared.ts) run only when asked,
# through `npm run test:integration`.

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # The runner has no git identity; tests that commit without setting one on
      # their repo would fail here and pass on a dev machine.
      - name: Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      # os.tmpdir() on the runner is the 8.3 form (C:\Users\RUNNER~1\...), which
      # realpath expands: lexical containment checks would then disagree. RUNNER_TEMP
      # is a long path.
      - name: Long temp path
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - run: npm ci

      - run: npm test
