name: Tests (Windows)

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest shard ${{ matrix.shard }}/4
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      # Every shard reports, so one failing shard doesn't hide the others' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # The runner has no git identity; tests that commit without setting one on
      # their repo would fail here and pass on a dev machine.
      - name: Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      # os.tmpdir() on the runner is the 8.3 form (C:\Users\RUNNER~1\...), which
      # realpath expands: lexical containment checks would then disagree. RUNNER_TEMP
      # is a long path.
      - name: Long temp path
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - run: npm ci

      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck

      - name: vitest
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=vitest-${{ matrix.shard }}.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: vitest-${{ matrix.shard }}.json
          if-no-files-found: ignore
